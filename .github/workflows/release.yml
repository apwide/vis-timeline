name: Release

on:
  push:
    branches: ["master"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git
        run: |
          git config user.name "ci"
          git config user.email "ci@apwide.com"

      - run: npm ci
      - run: npm run build
      - run: npm run test

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to git
        # npm pack runs "prepare" (husky), whose stdout pollutes the tarball name read by publish-to-git
        env:
          npm_config_ignore_scripts: true
        run: npx --yes publish-to-git@1.2.0

      - name: Tag sources
        run: |
          git tag "release-${{ steps.version.outputs.version }}"
          git push origin "release-${{ steps.version.outputs.version }}"

      - name: Bump version
        run: |
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push origin HEAD:master
